[project]
name = "llm-launcher"
version = "1.3.1"
description = "llama.cpp 桌面启动器"
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "huggingface-hub>=0.20.0",
    "PySide6>=6.5.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0"]
build = ["nuitka>=4.1.1", "ziglang>=0.16.0"]

[tool.uv]
package = false
python-preference = "only-managed"

[tool.pytest.ini_options]
addopts = "--basetemp=.pytest_cache/tmp"
